version: '3.8'

services:
  db:
    image: mariadb:latest
    container_name: shoppingcart-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shopping_cart_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ./initdb.sql:/docker-entrypoint-initdb.d/initdb.sql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -uuser -ppassword --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    container_name: shoppingcart-app
    environment:
      DB_URL: jdbc:mysql://db:3306/shopping_cart_db
      DB_USER: user
      DB_PASS: password
      DISPLAY: host.docker.internal:0
    depends_on:
      db:
        condition: service_healthy
